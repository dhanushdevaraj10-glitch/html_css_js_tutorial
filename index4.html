<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="Result" onclick="update()">Click Button to change color</button>

    <script>
        var btn=document.getElementById("Result");

        function update()
        {
           btn.style.backgroundColor="red"
        }
    </script>

</body>
</html>
