<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
       .OverLay
       {
        background-color: black;
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0%;
        left: 0%;
        opacity:0.8;
        z-index: 1;
        display: none;
       }

       .PopupBox
       {
        position: absolute;
        z-index: 2;
        background-color: white;
        color: black;
        width:550px;
        padding: 18px;
        border-radius: 10px;
        left: 30%;
        display: none;
       }
    </style>


    <button onclick="showPopup()">Show</button>
    <div class="OverLay"></div>
    <div class="PopupBox">
        <p><h4><h1>Popup</h1>Lorem ipsum dolor sit amet consectetur adipisicing elit. Minima, dolorum explicabo quaerat repellat fugiat necessitatibus, labore tempora quos laboriosam ab nam delectus sunt mollitia similique ipsam dicta, earum corrupti adipisci.</h4></p>
        <button onclick="closePopup()">Close</button>
    </div>
    <script>
        var OverLay=document.querySelector(".OverLay");
        var PopupBox=document.querySelector(".PopupBox");

        function showPopup()
        {
            OverLay.style.display="block";
            PopupBox.style.display="block";
        }

        function closePopup()
        {
            OverLay.style.display="none";
            PopupBox.style.display="none";
        }
    </script>
</body>
</html>
